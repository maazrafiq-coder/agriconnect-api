name: Backend CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      generate_baseline:
        description: "Generate prisma/migrations/0_init/migration.sql from schema.prisma and upload it as an artifact"
        type: boolean
        default: false

env:
  FRONTEND_URL: http://localhost:5173
  JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: agri_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/agri_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/agri_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Integration tests (real Postgres)
        run: |
          npm run test:integration:setup
          npm run test:integration
      - run: npx nest build
      - name: Strict TypeScript (non-blocking until the backlog is cleared)
        continue-on-error: true
        run: npm run typecheck:strict
      - name: Migrations apply to an empty DB and match schema.prisma
        if: hashFiles('prisma/migrations/**/migration.sql') != ''
        run: |
          export DATABASE_URL=postgresql://test:test@localhost:5433/postgres
          psql "$DATABASE_URL" -c "DROP DATABASE IF EXISTS mig_check" -c "CREATE DATABASE mig_check"
          export DATABASE_URL=postgresql://test:test@localhost:5433/mig_check
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agriconnect-backend .

  baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: |
          mkdir -p prisma/migrations/0_init
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
      - uses: actions/upload-artifact@v4
        with: { name: 0_init-migration, path: prisma/migrations/0_init/migration.sql }
