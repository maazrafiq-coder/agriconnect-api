# Throw-away Postgres for the integration tests (port 5433, tmpfs — no data kept).
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: agri_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
